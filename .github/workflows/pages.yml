# Déploiement sur GitHub Pages, lancé à la main (onglet Actions → « Déployer sur GitHub Pages » → Run workflow).
# Prérequis : Settings → Pages → Source : « GitHub Actions ».
# Pour déployer à chaque push sur main, ajoutez sous « on: » :
#   push:
#     branches: [main]
name: Déployer sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
