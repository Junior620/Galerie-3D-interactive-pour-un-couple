# Déploiement Netlify (via Git). Pour un glisser-déposer, il suffit du dossier dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les fichiers de assets/ ont un nom unique à chaque build : cache long.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le contenu (config, manifeste) doit toujours être relu.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
